[project]
name = "{{project_lower}}"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">={{python}}"
# 依存の pin には理由をコメントで残す (例: 上流の API 変更で壊れる, など)
dependencies = [
    "hydra-core>=1.3,<1.4",
    "matplotlib",
    "numpy",
    "omegaconf>=2.3",
    "pytorch-lightning>=2.0",
    # pytorch-lightning 2.2 系の RichProgressBar は rich 14 以降で起動時に落ちる
    # (IndexError: pop from empty list). lightning を古い版に pin するときは rich<14 にする.
    "rich",
    "torch>=2.0",
    "wandb",
]

[dependency-groups]
dev = [
    "ipdb",
    "pytest",
]
